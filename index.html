<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 1. Viewportによるズーム防止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ラーメン屋経営ゲーム</title>
    <style>
        /* 2. CSSによるタップ・ズーム・選択防止 */
        * {
            box-sizing: border-box;
            /* ダブルタップズームの無効化と連打遅延の解消 */
            touch-action: manipulation;
            /* テキスト選択（長押しや連打時の青いハイライト）を防止 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* スマホタップ時のグレー背景を透明化 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            /* 画面全体のスクロールによるガタつきを軽減 */
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            margin-top: 0;
        }

        .status-panel {
            background: #fff8e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffe082;
        }

        .status-item {
            font-size: 16px;
            margin: 8px 0;
            font-weight: bold;
            color: #333;
        }

        .staff-icons {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ffd54f;
            font-size: 15px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            color: #444;
            border-left: 4px solid #d32f2f;
            padding-left: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-buy {
            background-color: #ff9800;
            color: white;
        }

        .btn-buy:hover:not(:disabled) {
            background-color: #f57c00;
        }

        .btn-upgrade {
            background-color: #4caf50;
            color: white;
        }

        .btn-upgrade:hover:not(:disabled) {
            background-color: #388e3c;
        }

        .log-panel {
            background: #212121;
            color: #4caf50;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            border-radius: 6px;
            font-size: 13px;
            /* ログパネル内のみスクロールを許可 */
            touch-action: pan-y;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍜 ラーメン屋経営</h1>

    <div class="status-panel">
        <div class="status-item">所持金（売上）: <span id="money">1,000</span> 円</div>
        <div class="status-item">評価: <span id="eval">50</span> / 100</div>
        <div class="status-item">在庫ラーメン: <span id="stock">0</span> 杯</div>
        <div class="status-item">待ち客数: 👥 × <span id="customers">0</span></div>
        <div class="status-item">回転速度: 1客 / <span id="speed">3.0</span> 秒</div>
        
        <div class="staff-icons">
            🧑‍🔧×<span id="partTimeCount">0</span> 
            🙋‍♀️×<span id="waitressCount">0</span> 
            😎×<span id="youtuberCount">0</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">仕入れ</div>
        <button class="btn-buy" id="btnBuyRamen" onclick="buyRamen()">ラーメン購入 (500円)</button>
    </div>

    <div class="section">
        <div class="section-title">強化メニュー</div>
        <button class="btn-upgrade" id="btnBuyPartTime" onclick="buyPartTime()">バイト (1,000円) - 売上1.3倍</button>
        <button class="btn-upgrade" id="btnBuyWaitress" onclick="buyWaitress()">看板娘 (2,000円) - 回転率0.2秒短縮 [上限10]</button>
        <button class="btn-upgrade" id="btnBuyYoutuber" onclick="buyYoutuber()">YouTuber (20,000円) - 売上3倍</button>
    </div>

    <div class="section">
        <div class="section-title">運営ログ</div>
        <div class="log-panel" id="log"></div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // 3. JavaScriptによるズーム徹底ガード処理
    // -------------------------------------------------------------
    // iOS Safari等のピンチズーム防止
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    }, { passive: false });

    // Multi-touch（2本指タップ）による拡大防止
    document.addEventListener('touchstart', function (e) {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });

    // 連打（ダブルタップ）による拡大防止
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // PCでのCtrl + ホイールズーム防止
    document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
            e.preventDefault();
        }
    }, { passive: false });

    // PCでのCtrl + +/- キーによるズーム防止
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
        }
    });

    // -------------------------------------------------------------
    // ゲームロジック
    // -------------------------------------------------------------
    const INITIAL_STATE = {
        money: 1000,
        evaluation: 50,
        stock: 0,
        customers: 0,
        partTime: 0,
        waitress: 0,
        youtuber: 0,
        basePrice: 1050,
        baseSpeed: 3.0
    };

    let state = { ...INITIAL_STATE };
    let gameLoopTimer = null;

    // UI更新関数
    function updateUI() {
        document.getElementById('money').innerText = state.money.toLocaleString();
        document.getElementById('eval').innerText = state.evaluation;
        document.getElementById('stock').innerText = state.stock;
        document.getElementById('customers').innerText = state.customers;
        
        const currentSpeed = Math.max(0.2, state.baseSpeed - (state.waitress * 0.2)).toFixed(1);
        document.getElementById('speed').innerText = currentSpeed;

        document.getElementById('partTimeCount').innerText = state.partTime;
        document.getElementById('waitressCount').innerText = state.waitress;
        document.getElementById('youtuberCount').innerText = state.youtuber;

        // ボタンの活性/非活性制御
        document.getElementById('btnBuyWaitress').disabled = state.waitress >= 10;
    }

    // ログ出力関数
    function log(message) {
        const logPanel = document.getElementById('log');
        const entry = document.createElement('div');
        entry.innerText = `> ${message}`;
        logPanel.appendChild(entry);
        logPanel.scrollTop = logPanel.scrollHeight;
    }

    // ゲームオーバー判定
    function checkGameOver() {
        if (state.money < 0) {
            alert('所持金がマイナスになりました。ゲームオーバー！最初からやり直します。');
            resetGame();
            return true;
        }
        if (state.evaluation <= 0) {
            alert('評価が0になりました。ゲームオーバー！最初からやり直します。');
            resetGame();
            return true;
        }
        return false;
    }

    // ゲームリセット
    function resetGame() {
        state = { ...INITIAL_STATE };
        document.getElementById('log').innerHTML = '';
        log('ゲームをリセットしました。');
        updateUI();
        restartCustomerTimer();
    }

    // ラーメン購入ボタン処理
    function buyRamen() {
        state.money -= 500;
        state.stock += 1;
        log('ラーメンを1食購入しました (-500円)');
        updateUI();
        checkGameOver();
    }

    // バイト購入処理
    function buyPartTime() {
        if (state.money < 1000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 1000;
        state.partTime += 1;
        log('バイトを1人雇いました (-1,000円)');
        updateUI();
        checkGameOver();
    }

    // 看板娘購入処理
    function buyWaitress() {
        if (state.waitress >= 10) {
            log('看板娘は10人が上限です！');
            return;
        }
        if (state.money < 2000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 2000;
        state.waitress += 1;
        log('看板娘を1人雇いました (-2,000円)');
        updateUI();
        restartCustomerTimer();
        checkGameOver();
    }

    // YouTuber購入処理
    function buyYoutuber() {
        if (state.money < 20000) {
            log('所持金が足りません！');
            return;
        }
        state.money -= 20000;
        state.youtuber += 1;
        log('YouTuberを1人雇いました (-20,000円)');
        updateUI();
        checkGameOver();
    }

    // 客の来店処理 (一定周期で自動生成)
    setInterval(() => {
        const incoming = Math.floor(Math.random() * 3) + 1;
        state.customers += incoming;
        updateUI();
    }, 4000);

    // 接客・販売ループ
    function processCustomer() {
        if (state.customers > 0) {
            state.customers -= 1;

            if (state.stock > 0) {
                state.stock -= 1;
                
                // 売上計算: 基本(1050) × (1.3 ^ バイト数) × (3 ^ YouTuber数)
                let earnings = state.basePrice * Math.pow(1.3, state.partTime) * Math.pow(3, state.youtuber);
                earnings = Math.floor(earnings);
                
                state.money += earnings;
                log(`ラーメンが売れました！ (+${earnings.toLocaleString()}円)`);
            } else {
                // 在庫切れの場合は評価ダウン
                state.evaluation -= 5;
                log('ラーメンの在庫がありません！ 評価が下がり(-5)');
            }
            updateUI();
            checkGameOver();
        }
    }

    // 看板娘の数に応じてタイマーを再設定
    function restartCustomerTimer() {
        if (gameLoopTimer) clearInterval(gameLoopTimer);
        
        const currentSpeedSeconds = Math.max(0.2, state.baseSpeed - (state.waitress * 0.2));
        const intervalMs = currentSpeedSeconds * 1000;
        
        gameLoopTimer = setInterval(processCustomer, intervalMs);
    }

    // 初期化実行
    updateUI();
    restartCustomerTimer();
    log('お店を開店しました！');
</script>

</body>
</html>
